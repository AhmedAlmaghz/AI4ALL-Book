<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"
     viewBox="0 0 1200 650" role="img" aria-labelledby="figTitle">
  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5"
