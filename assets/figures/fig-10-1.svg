  <rect width="1200" height="650" fill="#FFFFFF"/>
  <title>الخطوط الحمراء الستة</title><desc>الخطوط الحمراء الستة — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الخطوط الحمراء الستة</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما لا تفعله… حتى لو كان سهلًا</text><rect x="792.0" y="170" width="340" height="190" rx="14" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="1106.0" cy="196" r="18" fill="#B91C1C" stroke="none" stroke-width="0"/><text x="1106.0" y="201.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="962.0" y="228.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الملكية</text><text x="962.0" y="266.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تلصق ما لا تملك</text><text x="962.0" y="288.4" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">حق مشاركته.</text><rect x="430.0" y="170" width="340" height="190" rx="14" fill="#FEF2F2" stroke="#B45309" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="744.0" cy="196" r="18" fill="#B45309" stroke="none" stroke-width="0"/><text x="744.0" y="201.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="600.0" y="228.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الحقيقة</text><text x="600.0" y="266.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تنشر ما لم</text><text x="600.0" y="288.4" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تتحقق منه.</text><rect x="68.0" y="170" width="340" height="190" rx="14" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="382.0" cy="196" r="18" fill="#B91C1C" stroke="none" stroke-width="0"/><text x="382.0" y="201.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="238.0" y="228.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">القرار</text><text x="238.0" y="266.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تترك قرارًا يؤثر</text><text x="238.0" y="288.4" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">على إنسان لآلة وحدها.</text><rect x="792.0" y="382" width="340" height="190" rx="14" fill="#FEF2F2" stroke="#B45309" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="1106.0" cy="408" r="18" fill="#B45309" stroke="none" stroke-width="0"/><text x="1106.0" y="413.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">4</text><text x="962.0" y="440.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الهوية</text><text x="962.0" y="478.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تنتحل صوت أحد</text><text x="962.0" y="500.4" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أو صورته دون إذن.</text><rect x="430.0" y="382" width="340" height="190" rx="14" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="744.0" cy="408" r="18" fill="#B91C1C" stroke="none" stroke-width="0"/><text x="744.0" y="413.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">5</text><text x="600.0" y="440.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الشفافية</text><text x="600.0" y="478.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تخفِ أن المحتوى</text><text x="600.0" y="500.4" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مولّد حين يكون الإخفاء مضللًا.</text><rect x="68.0" y="382" width="340" height="190" rx="14" fill="#FEF2F2" stroke="#B45309" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="382.0" cy="408" r="18" fill="#B45309" stroke="none" stroke-width="0"/><text x="382.0" y="413.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">6</text><text x="238.0" y="440.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الصلاحية</text><text x="238.0" y="478.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تمنح صلاحية أكبر</text><text x="238.0" y="500.4" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مما تحتاجه المهمة.</text><text x="600" y="605.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الخطوط ليست منفصلة؛ قد يجتمع خطان في موقف واحد. المهم أن تعرف أي خط تجاوزت.</text>
</svg>
