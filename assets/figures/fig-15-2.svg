  <title>محطات الاجتماع الثلاث</title><desc>محطات الاجتماع الثلاث — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">محطات الاجتماع الثلاث</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">عقد قبل… سجل أثناء… محضر ومتابعة بعد</text><rect x="800.0" y="195" width="364.0" height="290" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="1136.0" cy="223" r="20" fill="#14213D" stroke="none" stroke-width="0"/><text x="1136.0" y="229.48" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="982.0" y="259.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">قبل</text><rect x="942.0" y="277" width="80" height="2" rx="0" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0"/><text x="982.0" y="311.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">هدف مكتوب، جدول،</text><text x="982.0" y="339.4" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أدوار، ومخرجات متوقعة.</text><rect x="418.0" y="195" width="364.0" height="290" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="754.0" cy="223" r="20" fill="#0F766E" stroke="none" stroke-width="0"/><text x="754.0" y="229.48" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="600.0" y="259.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="28" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أثناء</text><rect x="560.0" y="277" width="80" height="2" rx="0" fill="#0F766E" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="600.0" y="311.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">سجل القرارات والمهام</text><text x="600.0" y="339.4" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">والأسئلة المفتوحة.</text><rect x="36.0" y="195" width="364.0" height="290" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="372.0" cy="223" r="20" fill="#C6A15B" stroke="none" stroke-width="0"/><text x="372.0" y="229.48" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="218.0" y="259.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="28" font-weight="700" fill="#C6A15B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">بعد</text><rect x="178.0" y="277" width="80" height="2" rx="0" fill="#C6A15B" stroke="#C6A15B" stroke-width="2" opacity="1.0"/><text x="218.0" y="311.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">محضر من صفحة،</text><text x="218.0" y="339.4" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ثم متابعة: من، ماذا، متى.</text><path d="M 807.0 320.0 L 775.0 340.0 L 807.0 360.0" fill="none" stroke="#0F766E" stroke-width="4.5" opacity="1.0"/><path d="M 425.0 320.0 L 393.0 340.0 L 425.0 360.0" fill="none" stroke="#0F766E" stroke-width="4.5" opacity="1.0"/><text x="600" y="543.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا اجتماع بلا هدف مكتوب، ولا مهمة بلا مسؤول وموعد.</text>
</svg>
