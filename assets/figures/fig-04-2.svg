  <rect width="1200" height="720" fill="#FFFFFF"/>
  <title>شجرة اختيار الأداة</title><desc>شجرة اختيار الأداة — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">شجرة اختيار الأداة</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ابدأ من نوع المادة، لا من اسم الأداة</text><line x1="600" y1="265" x2="1026.0" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><line x1="600" y1="265" x2="742.0" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><line x1="600" y1="265" x2="458.0" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><line x1="600" y1="265" x2="174.0" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><rect x="435.0" y="170" width="330" height="95" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><text x="600" y="208.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="25" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما نوع المادة؟</text><text x="600" y="238.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">حدد المهمة أولًا.</text><rect x="892.0" y="440" width="268.0" height="180" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="1138.0" cy="462" r="15" fill="#0F766E" stroke="none" stroke-width="0"/><text x="1138.0" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="1026.0" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">نص</text><text x="1026.0" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">محادثة، تلخيص،</text><text x="1026.0" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تحرير، بحث.</text><rect x="608.0" y="440" width="268.0" height="180" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="854.0" cy="462" r="15" fill="#C6A15B" stroke="none" stroke-width="0"/><text x="854.0" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="742.0" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#C6A15B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">صورة</text><text x="742.0" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">توليد، تحرير،</text><text x="742.0" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تحليل، وصف.</text><rect x="324.0" y="440" width="268.0" height="180" rx="14" fill="#FEF2F2" stroke="#B45309" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="570.0" cy="462" r="15" fill="#B45309" stroke="none" stroke-width="0"/><text x="570.0" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="458.0" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">صوت وفيديو</text><text x="458.0" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تفريغ، ترجمة،</text><text x="458.0" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تلخيص، مقاطع.</text><rect x="40.0" y="440" width="268.0" height="180" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="286.0" cy="462" r="15" fill="#15803D" stroke="none" stroke-width="0"/><text x="286.0" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">4</text><text x="174.0" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#15803D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">بيانات وإجراء</text><text x="174.0" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">جدول، رسم،</text><text x="174.0" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أتمتة، وكيل.</text><text x="600" y="675.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">إذا تعددت الإجابات، فالمهمة تحتاج سلسلة أدوات لا أداة واحدة.</text>
</svg>
