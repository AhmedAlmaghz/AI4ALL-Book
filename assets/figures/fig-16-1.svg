i:isolate">بطاقة الأتمتة</text><text x="600" y="454.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ستة أجزاء قبل التنفيذ</text><text x="600" y="758.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">البطاقة ليست نموذجًا تقنيًا، بل طريقة تفكير: إن لم تستطع ملأها، لا تبنِ السير.</text>
