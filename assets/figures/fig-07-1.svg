<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="طبقات السياق الأربع">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C6A15B"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14213D" flood-opacity="0.10"/>
    </filter>
  </defs>
  <title>طبقات السياق الأربع</title>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="600" y="64" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">طبقات السياق الأربع</text><text x="600" y="106" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من العام إلى الخاص… وداخل إطار من الحدود</text><rect x="80" y="160" width="1040" height="480" rx="20" fill="#FEF2F2" stroke="#B91C1C" stroke-width="3" opacity="0.55" stroke-dasharray="12 8"/><rect x="930" y="142" width="150" height="38" rx="19" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2.5" opacity="1.0"/><text x="1005" y="169" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الحدود</text><text x="1090" y="207" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#B91C1C" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما لا يُقال، وما لا يُرسل، وما لا يُنشر</text><text x="120" y="138" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="600" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من العام</text><path d="M 120 176 L 120 624" fill="none" stroke="#64748B" stroke-width="3" opacity="1.0" marker-end="url(#arrow)"/><text x="120" y="668" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="600" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">إلى الخاص</text><rect x="190" y="240" width="880" height="105" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><rect x="190" y="240" width="14" height="105" rx="7" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0"/><circle cx="240" cy="292" r="19" fill="#14213D" stroke="none" stroke-width="2" opacity="1.0"/><text x="240" y="300" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="1040" y="285" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الهوية</text><text x="1040" y="321" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#1F2937" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من أنا؟ تخصصي، لغتي، جمهوري، أسلوبي.</text><rect x="190" y="365" width="880" height="105" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><rect x="190" y="365" width="14" height="105" rx="7" fill="#0F766E" stroke="#0F766E" stroke-width="2" opacity="1.0"/><circle cx="240" cy="417" r="19" fill="#0F766E" stroke="none" stroke-width="2" opacity="1.0"/><text x="240" y="425" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="1040" y="410" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="28" font-weight="700" fill="#0F766E" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المشروع</text><text x="1040" y="446" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#1F2937" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما المشروع؟ أهدافه، مصادره، مقياس نجاحه.</text><rect x="190" y="490" width="880" height="105" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><rect x="190" y="490" width="14" height="105" rx="7" fill="#C6A15B" stroke="#C6A15B" stroke-width="2" opacity="1.0"/><circle cx="240" cy="542" r="19" fill="#C6A15B" stroke="none" stroke-width="2" opacity="1.0"/><text x="240" y="550" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="1040" y="535" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="28" font-weight="700" fill="#C6A15B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المهمة الحالية</text><text x="1040" y="571" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#1F2937" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما المطلوب الآن؟ الصيغة، الطول، الموعد.</text><text x="600" y="715" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">كلما اقتربت الطبقة من المهمة، صار السياق أدق… والحدود تمنع الانحراف.</text>
</svg>
