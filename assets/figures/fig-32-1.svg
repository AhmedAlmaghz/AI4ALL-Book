oma,Arial,sans-serif" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">العلاقة</text><rect x="312.0" y="207" width="138" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" opacity="1.0"/><text x="381.0" y="253.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المسؤولية</text><rect x="166.0" y="207" width="138" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" opacity="1.0"/><text x="235.0" y="253.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">التعلم</text><text x="600" y="165.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">عرض المهارات</text><rect x="480" y="310" width="240" height="250" rx="18" fill="#ECFDF5" stroke="#0F766E" stroke-width="3" opacity="1.0" filter="url(#softShadow)"/><text x="600" y="358.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="24" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">عمق تخصصك</text><text x="600" y="398.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مشروع حقيقي + مقياس</text><text x="600" y="419.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-