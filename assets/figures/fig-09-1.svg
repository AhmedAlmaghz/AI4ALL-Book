  <title>حلقة التحسين</title>
  <rect width="1200" height="780" fill="#FFFFFF"/>
  <text x="600" y="62" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">حلقة التحسين</text><text x="600" y="102" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">قيّم… غيّر… قارن… ثم توقف</text><rect x="465" y="150" width="270" height="140" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="700" cy="180" r="18" fill="#14213D" stroke="none" stroke-width="2" opacity="1.0"/><text x="700" y="188" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="600" y="212" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">قيّم</text><text x="600" y="252" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="600" dy="0">أين يقصّر النص</tspan><tspan x="600" dy="24.65">وفق المعيار؟</tspan></text><rect x="115" y="330" width="270" height="140" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="350" cy="360" r="18" fill="#0F766E" stroke="none" stroke-width="2" opacity="1.0"/><text x="350" y="368" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="250" y="392" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">غيّر</text><text x="250" y="432" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="250" dy="0">ما التغيير الواحد</tspan><tspan x="250" dy="24.65">الذي سأجرّبه؟</tspan></text><rect x="465" y="510" width="270" height="140" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="700" cy="540" r="18" fill="#C6A15B" stroke="none" stroke-width="2" opacity="1.0"/><text x="700" y="548" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="600" y="572" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#C6A15B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">قارن</text><text x="600" y="612" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="600" dy="0">هل تحسّن المعيار؟</tspan><tspan x="600" dy="24.65">أُبقي أم أتراجع؟</tspan></text><rect x="815" y="330" width="270" height="140" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="1050" cy="360" r="18" fill="#15803D" stroke="none" stroke-width="2" opacity="1.0"/><text x="1050" y="368" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">4</text><text x="950" y="392" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#15803D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">توقف</text><text x="950" y="432" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="950" dy="0">هل تحقق الهدف</tspan><tspan x="950" dy="24.65">أو انتهى الوقت؟</tspan></text><path d="M 450 240 Q 330 250 285 315" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><path d="M 285 470 Q 350 520 440 550" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><path d="M 750 560 Q 850 530 915 480" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><path d="M 915 315 Q 850 250 760 235" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><circle cx="600" cy="400" r="105" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.5" opacity="1"/><text x="600" y="382" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="24" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تغيير واحد</text><text x="600" y="414" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لكل جولة</text><text x="600" y="444" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">وقس الفرق</text><text x="600" y="730" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الحلقة ليست دورانًا بلا نهاية. لكل جولة سؤال واحد، وتغيير واحد، ومقارنة واحدة.</text>
</svg>
