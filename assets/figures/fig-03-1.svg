  <title>من النص إلى الاحتمال</title><desc>من النص إلى الاحتمال — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من النص إلى الاحتمال</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">النموذج لا يقرأ معناك؛ يحسب ما يلي</text><rect x="880.0" y="160" width="250" height="125" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><text x="1005.0" y="198.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="23" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">النص</text><text x="1005.0" y="238.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">«ذهبت إلى…»</text><rect x="610.0" y="160" width="250" height="125" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><text x="735.0" y="198.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">التقطيع</text><text x="735.0" y="238.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">كلمات أو رموز</text><rect x="340.0" y="160" width="250" height="125" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.5" opacity="1.0" filter="ur