  <title>عائلات الذكاء الاصطناعي</title><desc>عائلات الذكاء الاصطناعي — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">عائلات الذكاء الاصطناعي</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">دوائر متداخلة… ليست بديلًا عن بعضها</text><circle cx="410" cy="400" r="255" fill="#EEF2FF" fill-opacity="0.55" stroke="#14213D" stroke-width="3"/><circle cx="585" cy="400" r="190" fill="#ECFDF5" fill-opacity="0.65" stroke="#0F766E" stroke-width="3"/><circle cx="750" cy="400" r="128" fill="#FFFBEB" fill-opacity="0.75" stroke="#C6A15B" stroke-width="3"/><circle cx="805" cy="400" r="66" fill="#F0FDF4" fill-opacity="0.85" stroke="#15803D" stroke-width="2.5"/><text x="235" y="148.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الذكاء الاصطناعي</text><line x1="280" y1="162" x2="345" y2="285" stroke="#14213D" stroke-width="2" opacity="1.0"/><text x="585" y="148.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تعلم الآلة</text><line x1="585" y1="162" x2="585" y2="250" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="930" y="210.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="24" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">التعلم العميق</text><line x1="895" y1="224" x2="820" y2="320" stroke="#C6A15B" stroke-width="2" opacity="1.0"/><text x="1115" y="392.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="700" fill="#15803D" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">توليدي</text><text x="1115" y="420.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#15803D" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ونماذج لغوية</text><line x1="990" y1="400" x2="872" y2="400" stroke="#15803D" stroke-width="2" opacity="1.0"/><text x="300" y="672.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أنظمة خبيرة، روبوتات، ألعاب</text><text x="560" y="672.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تصنيف، تنبؤ، توصية</text><text x="790" y="672.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">شبكات عصبية، صور، صوت</text><text x="805" y="480.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#15803D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">نص، صورة، كود</text><text x="600" y="722.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">كل نموذج توليدي يستخدم تعلم الآلة، لكن ليس كل تعلم آلي توليديًا.</text>
