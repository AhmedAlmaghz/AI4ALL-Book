  <title>نافذة السياق</title><desc>نافذة السياق — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">نافذة السياق</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما يدخل… وما يُقطع حين يطول النص</text><text x="1080" y="150.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="600" fill="#0F766E" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">بداية المحادثة</text><text x="120" y="150.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="600" fill="#B45309" text-anchor="end" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الآن</text><line x1="1080" y1="162" x2="130" y2="162" stroke="#64748B" stroke-width="2" opacity="1.0" marker-end="url(#arrowMuted)"/><rect x="100" y="190" width="1000" height="250" rx="20" fill="#F8FAFC" stroke="#14213D" stroke-width="2.5" opacity="1.0"/><rect x="968" y="240" width="72" height="72" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2" opacity="1"/><text x="1004" y="282.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="12" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">بداية</text><rect x="888" y="240" width="72" height="72" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2" opacity="1"/><text x="924" y="282.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="12" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolat