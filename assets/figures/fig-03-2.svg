700" fill="#B91C1C" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">حدّ النافذة</text><path d="M 416 218 L 1110 218" fill="none" stroke="#0F766E" stroke-width="2" opacity="1.0"/><path d="M 1100 208 L 1110 218 L 1100 228" fill="none" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="760" y="208.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما يصل إلى النموذج</text><path d="M 390 498 L 110 498" fill="none" stroke="#B91C1C" stroke-width="2" opacity="1.0"/><path d="M 120 488 L 110 498 L 120 508" fill="none" stroke="#B91C1C" stroke-width="2" opacity="1.0"/><text x="250" y="526.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما يُقطع أو يُفقد</text><text x="600" y="590.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لخّص، أو قسّم المهمة، أو ضع الأهم في البداية. النافذة ليست ذاكرة دائمة.</text>
