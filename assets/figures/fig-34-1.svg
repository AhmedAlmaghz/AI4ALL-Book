  <title>قوس التسعين يومًا</title>
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="600" y="62" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">قوس التسعين يومًا</text><text x="600" y="102" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ثبّت… وسّع… علّم</text><rect x="820" y="190" width="320" height="210" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="1105" cy="225" r="22" fill="#14213D" stroke="none" stroke-width="2" opacity="1.0"/><text x="1105" y="233" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="980" y="245" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="30" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ثبّت</text><rect x="930" y="268" width="100" height="32" rx="16" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0"/><text x="980" y="290" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">⁦1–30⁩</text><text x="980" y="340" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="600" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">نظام واحد، عادة واحدة</text><text x="980" y="372" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">استخدام أسبوعي منتظم</text><rect x="440" y="190" width="320" height="210" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="725" cy="225" r="22" fill="#0F766E" stroke="none" stroke-width="2" opacity="1.0"/><text x="725" y="233" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="600" y="245" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="30" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">وسّع</text><rect x="550" y="268" width="100" height="32" rx="16" fill="#0F766E" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="600" y="290" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">⁦31–60⁩</text><text x="600" y="340" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="600" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">حالة استخدام ثانية</text><text x="600" y="372" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">نتيجة أفضل أو وقت أقل</text><rect x="60" y="190" width="320" height="210" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="345" cy="225" r="22" fill="#C6A15B" stroke="none" stroke-width="2" opacity="1.0"/><text x="345" y="233" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="220" y="245" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="30" font-weight="700" fill="#C6A15B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">علّم</text><rect x="170" y="268" width="100" height="32" rx="16" fill="#C6A15B" stroke="#C6A15B" stroke-width="2" opacity="1.0"/><text x="220" y="290" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">⁦61–90⁩</text><text x="220" y="340" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="600" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">وثّق، درّب، راجع</text><text x="220" y="372" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">نظام يعيش بدونك</text><line x1="1120" y1="455" x2="80" y2="455" stroke="#64748B" stroke-width="3" opacity="1.0" marker-end="url(#arrow)"/><line x1="980" y1="400" x2="980" y2="445" stroke="#14213D" stroke-width="2" opacity="1.0"/><circle cx="980" cy="455" r="10" fill="#14213D" stroke="none" stroke-width="2" opacity="1.0"/><line x1="600" y1="400" x2="600" y2="445" stroke="#0F766E" stroke-width="2" opacity="1.0"/><circle cx="600" cy="455" r="10" fill="#0F766E" stroke="none" stroke-width="2" opacity="1.0"/><line x1="220" y1="400" x2="220" y2="445" stroke="#C6A15B" stroke-width="2" opacity="1.0"/><circle cx="220" cy="455" r="10" fill="#C6A15B" stroke="none" stroke-width="2" opacity="1.0"/><text x="980" y="490" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الشهر الأول</text><text x="600" y="490" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الشهر الثاني</text><text x="220" y="490" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الشهر الثالث</text><text x="600" y="550" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الشهر الأول ليس للنتائج الكبيرة؛ هو لإثبات أنك تستطيع التكرار.</text>
