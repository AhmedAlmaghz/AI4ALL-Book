<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640"
     viewBox="0 0 1200 640" role="img" aria-labelledby="figTitle">
  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C6A15B"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14213D" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <title>ثلاثة أنواع من التعلم</title><desc>ثلاثة أنواع من التعلم — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ثلاثة أنواع من التعلم</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">النوع يحدد البيانات والهدف، لا مستوى الذكاء</text><rect x="797.0" y="180" width="350" height="280" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="1121.0" cy="206" r="18" fill="#14213D" stroke="none" stroke-width="0"/><text x="1121.0" y="211.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="972.0" y="238.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="25" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">بالإشراف</text><text x="972.0" y="276.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">بيانات موسومة.</text><text x="972.0" y="301.2" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الهدف: تصنيف أو تنبؤ.</text><text x="972.0" y="326.4" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مثال: بريد مزعج.</text><rect x="425.0" y="180" width="350" height="280" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="749.0" cy="206" r="18" fill="#0F766E" stroke="none" stroke-width="0"/><text x="749.0" y="211.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="600.0" y="238.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">بدون إشراف</text><text x="600.0" y="276.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">بيانات بلا وسوم.</text><text x="600.0" y="301.2" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الهدف: اكتشاف أنماط.</text><text x="600.0" y="326.4" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مثال: تقسيم عملاء.</text><rect x="53.0" y="180" width="350" height="280" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="377.0" cy="206" r="18" fill="#C6A15B" stroke="none" stroke-width="0"/><text x="377.0" y="211.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="228.0" y="238.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="25" font-weight="700" fill="#C6A15B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">بالتعزيز</text><text x="228.0" y="276.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مكافأة وعقاب.</text><text x="228.0" y="301.2" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الهدف: سياسة أفضل.</text><text x="228.0" y="326.4" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مثال: لعبة أو روبوت.</text><text x="600" y="595.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">النوع يحدد نوع البيانات والهدف؛ ولا يعني أن أحدها «أذكى» من الآخر.</text>
</svg>
