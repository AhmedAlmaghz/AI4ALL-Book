  <title>أسبوع الطالب</title><desc>أسبوع الطالب — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أسبوع الطالب</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مخرج واحد ملموس… لا خطة شهر كامل</text><rect x="60" y="140" width="1080" height="62" rx="14" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0"/><text x="1080" y="166.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الهدف الأسبوعي: مسودة فصل + ملاحظة تركيب</text><text x="1080" y="190.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#E2E8F0" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المخرج الملموس: 2,000 كلمة + 3 مصادر جديدة</text><rect x="1008.5714285714286" y="230" width="151.42857142857142" height="360" rx="14" fill="#F8FAFC" stroke="#14213D" stroke-width="2" opacity="1.0" filter="url(#softShadow)"/><rect x="1008.5714285714286" y="230" width="151.42857142857142" height="46" rx="12" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0"/><text x="1084.2857142857142" y="261.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الأحد</text><text x="1084.2857142857142" y="312.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تخطيط وقراءة</text><text x="1084.2857142857142" y="350.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">15 د: اختر المخرج</text><text x="1084.2857142857142" y="368.85" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">90 د: اقرأ مصدرًا</text><text x="1084.2857142857142" y="420.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">اكتب 3 أولويات فقط</text><circle cx="1084.2857142857142" cy="564" r="7" fill="#14213D" stroke="none" stroke-width="0"/><rect x="847.1428571428571" y="230" width="151.42857142857142" height="360" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" opacity="1.0" filter="url(#softShadow)"/><rect x="847.1428571428571" y="230" width="151.42857142857142" height="46" rx="12" fill="#0F766E" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="922.8571428571428" y="261.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الاثنين</text><text x="922.8571428571428" y="312.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">كتابة أولى</text><text x="922.8571428571428" y="350.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-we