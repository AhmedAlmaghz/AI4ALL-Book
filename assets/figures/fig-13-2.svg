  <rect width="1200" height="720" fill="#FFFFFF"/>
  <title>شجرة اختيار الرسم البياني</title><desc>شجرة اختيار الرسم البياني — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">شجرة اختيار الرسم البياني</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ابدأ من السؤال… لا من شكل الرسم</text><line x1="600" y1="265" x2="1054.3999999999999" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><line x1="600" y1="265" x2="827.1999999999999" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><line x1="600" y1="265" x2="600.0" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><line x1="600" y1="265" x2="372.79999999999995" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><line x1="600" y1="265" x2="145.6" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><rect x="435.0" y="170" width="330" height="95" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><text x="600" y="208.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="25" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما سؤالك؟</text><text x="600" y="238.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">اختر الرسم من السؤال، لا من الجمال.</text><rect x="948.8" y="440" width="211.2" height="190" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="1138.0" cy="462" r="15" fill="#0F766E" stroke="none" stroke-width="0"/><text x="1138.0" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="1054.3999999999999" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مقارنة فئات</text><text x="1054.3999999999999" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أعمدة أفقية أو رأسية.</text><text x="1054.3999999999999" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تجنب الأعمدة ثلاثية الأبعاد.</text><rect x="721.5999999999999" y="440" width="211.2" height="190" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="910.8" cy="462" r="15" fill="#C6A15B" stroke="none" stroke-width="0"/><text x="910.8" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="827.1999999999999" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#C6A15B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">اتجاه زمني</text><text x="827.1999999999999" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">خط.</text><text x="827.1999999999999" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تجنب نقاطًا بلا ترتيب.</text><rect x="494.4" y="440" width="211.2" height="190" rx="14" fill="#FEF2F2" stroke="#B45309" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="683.5999999999999" cy="462" r="15" fill="#B45309" stroke="none" stroke-width="0"/><text x="683.5999999999999" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="600.0" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">توزيع</text><text x="600.0" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مدرج تكراري أو نقاط.</text><text x="600.0" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا متوسط وحده.</text><rect x="267.2" y="440" width="211.2" height="190" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="456.4" cy="462" r="15" fill="#15803D" stroke="none" stroke-width="0"/><text x="456.4" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">4</text><text x="372.79999999999995" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#15803D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">علاقة</text><text x="372.79999999999995" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">نقاط مبعثرة.</text><text x="372.79999999999995" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تستنتج السببية من الارتباط.</text><rect x="40.0" y="440" width="211.2" height="190" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="229.2" cy="462" r="15" fill="#14213D" stroke="none" stroke-width="0"/><text x="229.2" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">5</text><text x="145.6" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">جزء من كل</text><text x="145.6" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أعمدة مكدسة، أو دائري</text><text x="145.6" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">بعدد قليل من الشرائح.</text><text x="600" y="675.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">إذا احتجت رسمين، فالسؤال مركّب؛ افصله إلى سؤالين قبل أن ترسم.</text>
</svg>
