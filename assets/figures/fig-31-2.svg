<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="خطوط الدفاع الثلاثة">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C6A15B"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14213D" flood-opacity="0.10"/>
    </filter>
  </defs>
  <title>خطوط الدفاع الثلاثة</title>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="600" y="62" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">خطوط الدفاع الثلاثة</text><text x="600" y="102" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من التنفيذ اليومي إلى المراجعة المستقلة</text><rect x="70" y="150" width="1060" height="490" rx="28" fill="#FEF2F2" stroke="#B91C1C" stroke-width="3" opacity="1.0"/><rect x="180" y="230" width="840" height="350" rx="24" fill="#ECFDF5" stroke="#0F766E" stroke-width="3" opacity="1.0"/><rect x="290" y="310" width="620" height="210" rx="20" fill="#EEF2FF" stroke="#14213D" stroke-width="3" opacity="1.0"/><circle cx="95" cy="150" r="22" fill="#B91C1C" stroke="none" stroke-width="2" opacity="1.0"/><text x="95" y="158" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="600" y="190" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="24" font-weight="700" fill="#B91C1C" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المراجعة</text><text x="600" y="218" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">قيادة أو جهة مستقلة تسأل: هل الضوابط تعمل؟</text><circle cx="205" cy="230" r="22" fill="#0F766E" stroke="none" stroke-width="2" opacity="1.0"/><text x="205" y="238" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="600" y="268" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="24" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المراقبة</text><text x="600" y="296" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">شخص أو وظيفة تفحص السجلات والمؤشرات.</text><circle cx="315" cy="310" r="22" fill="#14213D" stroke="none" stroke-width="2" opacity="1.0"/><text x="315" y="318" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="600" y="348" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="24" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">التنفيذ</text><text x="600" y="376" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الفريق يطبق الضوابط يوميًا.</text><text x="600" y="440" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="30" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">العمل اليومي</text><text x="600" y="475" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الأداة + الفريق + الضوابط</text><text x="600" y="690" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تجعل المنفذ هو المراجع الوحيد. من يريد أن ينجح العمل قد لا يرى الخطر.</text>
</svg>
