  <title>رحلة البيانات السبع</title><desc>رحلة البيانات السبع — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">رحلة البيانات السبع</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من السؤال إلى القرار… لا تبدأ بالرسم</text><rect x="1018.2857142857142" y="180" width="145.71428571428572" height="260" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="1136.0" cy="208" r="20" fill="#14213D" stroke="none" stroke-width="0"/><text x="1136.0" y="214.48" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="1091.142857142857" y="244.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">سؤال</text><rect x="1051.142857142857" y="262" width="80" height="2" rx="0" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0"/><text x="1091.142857142857" y="296.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ماذا نريد</text><text x="1091.142857142857" y="317.3" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أن نعرف؟</text><rect x="854.5714