  <rect width="1200" height="740" fill="#FFFFFF"/>
  <title>شجرة اختيار الرسم</title><desc>شجرة اختيار الرسم — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">شجرة اختيار الرسم</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ستة أسئلة… ستة رسوم… وأخطاء تتجنبها</text><line x1="600" y1="265" x2="1073.3333333333335" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><line x1="600" y1="265" x2="884.0" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><line x1="600" y1="265" x2="694.6666666666666" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><line x1="600" y1="265" x2="505.33333333333337" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><line x1="600" y1="265" x2="316.0" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><line x1="600" y1="265" x2="126.66666666666667" y2="430" stroke="#0F766E" stroke-width="3" opacity="1.0" marker-end="url(#arrowTeal)"/><rect x="435.0" y="170" width="330" height="95" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><text x="600" y="208.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="25" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما سؤالك؟</text><text x="600" y="238.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الرسم يخدم السؤال، لا العكس.</text><rect x="986.6666666666667" y="440" width="173.33333333333334" height="195" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="1138.0" cy="462" r="15" fill="#0F766E" stroke="none" stroke-width="0"/><text x="1138.0" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="1073.3333333333335" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">كيف تغير عبر الوقت؟</text><text x="1073.3333333333335" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">خط.</text><text x="1073.3333333333335" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تجنب نقاطًا قليلة جدًا.</text><rect x="797.3333333333334" y="440" width="173.33333333333334" height="195" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="948.6666666666667" cy="462" r="15" fill="#C6A15B" stroke="none" stroke-width="0"/><text x="948.6666666666667" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="884.0" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#C6A15B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">كيف يقارن هذا بذاك؟</text><text x="884.0" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أعمدة.</text><text x="884.0" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تجنب محورًا مقطوعًا.</text><rect x="608.0" y="440" width="173.33333333333334" height="195" rx="14" fill="#FEF2F2" stroke="#B45309" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="759.3333333333334" cy="462" r="15" fill="#B45309" stroke="none" stroke-width="0"/><text x="759.3333333333334" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="694.6666666666666" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">كيف يتوزع؟</text><text x="694.6666666666666" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مدرج تكراري.</text><text x="694.6666666666666" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">فئات متساوية.</text><rect x="418.6666666666667" y="440" width="173.33333333333334" height="195" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="570.0" cy="462" r="15" fill="#15803D" stroke="none" stroke-width="0"/><text x="570.0" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">4</text><text x="505.33333333333337" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#15803D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">هل هناك علاقة؟</text><text x="505.33333333333337" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">انتشار.</text><text x="505.33333333333337" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تستنتج السبب.</text><rect x="229.33333333333334" y="440" width="173.33333333333334" height="195" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="380.6666666666667" cy="462" r="15" fill="#14213D" stroke="none" stroke-width="0"/><text x="380.6666666666667" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">5</text><text x="316.0" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما التركيب؟</text><text x="316.0" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أعمدة مكدسة.</text><text x="316.0" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تجنب دائرة مزدحمة.</text><rect x="40.0" y="440" width="173.33333333333334" height="195" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.3" opacity="1.0" filter="url(#softShadow)"/><circle cx="191.33333333333334" cy="462" r="15" fill="#0F766E" stroke="none" stroke-width="0"/><text x="191.33333333333334" y="466.68" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">6</text><text x="126.66666666666667" y="488.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما القيمة الدقيقة؟</text><text x="126.66666666666667" y="522.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">جدول.</text><text x="126.66666666666667" y="540.9" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تزدحمه.</text><text x="600" y="695.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">إذا لم تعرف السؤال، لا تفتح الأداة؛ الرسم بلا سؤال زخرفة.</text>
</svg>
