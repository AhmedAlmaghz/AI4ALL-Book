,sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أمثلة التغيير</text><text x="225" y="575" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="225" dy="0">حذف الحشو، تقصير الجمل،</tspan><tspan x="225" dy="26.099999999999998">ضبط النبرة.</tspan></text><line x1="805" y1="405" x2="775" y2="405" stroke="#64748B" stroke-width="3" opacity="1.0" marker-end="url(#arrow)"/><line x1="430" y1="405" x2="400" y2="405" stroke="#64748B" stroke-width="3" opacity="1.0" marker-end="url(#arrow)"/><text x="600" y="700" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تنتقل إلى الجولة التالية قبل أن تستقر الحالية. وغيّر شيئًا واحدًا في كل مرة.</text>
