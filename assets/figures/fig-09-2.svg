amily="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">السؤال</text><text x="975" y="445" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="975" dy="0">هل الترتيب منطقي؟</tspan><tspan x="975" dy="26.099999999999998">هل هناك جزء ناقص</tspan><tspan x="975" dy="26.099999999999998">أو زائد؟</tspan></text><text x="975" y="545" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أمثلة التغيير</text><text x="975" y="575" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="975" dy="0">إعادة ترتيب، حذف قسم،</tspan><tspan x="975" dy="26.099999999999998">إضافة توصية.</tspan></text><rect x="435" y="160" width="330" height="490" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="600" cy="205" r="24" fill="#0F766E" stroke="none" stroke-width="2" opacity="1.0"/><text x="600" y="213" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="600" y="260" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="27" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المحتوى</text><rect x="475" y="285" width="250" height="2" rx="0" fill="#0F766E" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="600" y="315" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">التركيز</text><text x="600" y="345" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="600" dy="0">هل كل ادعاء</tspan><tspan x="600" dy="26.099999999999998">مدعوم؟</tspan></text><text x="600" y="415" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">السؤال</text><text x="600" y="445" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="600" dy="0">هل الأمثلة محددة؟</tspan><tspan x="600" dy="26.099999999999998">هل هناك تعميمات؟</tspan></text><text x="600" y="545" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أمثلة التغيير</text><text x="600" y="575" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="600" dy="0">رقم موثق، مثال خاص</tspan><tspan x="600" dy="26.099999999999998">بدل العام.</tspan></text><rect x="60" y="160" width="330" height="490" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.5" opacity="1.0"