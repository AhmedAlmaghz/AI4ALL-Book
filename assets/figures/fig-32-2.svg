  <title>حلقة التعلم الأربعة</title><desc>حلقة التعلم الأربعة — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">حلقة التعلم الأربعة</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">جرّب… احصل على ملاحظة… عدّل… علّم</text><path d="M 729.8 191.0 A 420 225 0 0 1 999.4 335.5" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><path d="M 999.4 474.5 A 420 225 0 0 1 729.8 619.0" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><path d="M 470.2 619.0 A 420 225 0 0 1 200.6 474.5" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><path d="M 200.6 335.5 A 420 225 0 0 1 470.2 191.0" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><rect x="475.0" y="120.0" width="250" height="120" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="701.0" cy="144.0" r="16" fill="#14213D" stroke="none" stroke-width="0"/><text x="701.0" y="149.04" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="600.0" y="164.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="23" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">جرّب</text><text x="600.0" y="194.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anc