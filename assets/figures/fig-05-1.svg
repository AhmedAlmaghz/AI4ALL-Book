  <title>خطوات المحادثة الست</title>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="600" y="64" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">خطوات المحادثة الست</text><text x="600" y="106" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من النتيجة إلى المراجعة… ثم تعود لتحديث السياق</text><rect x="760" y="190" width="280" height="180" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="1010" cy="224" r="20" fill="#14213D" stroke="none" stroke-width="2" opacity="1.0"/><text x="1010" y="232" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="900" y="252" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="29" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">النتيجة</text><text x="900" y="302" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="900" dy="0">ماذا أريد أن أملك</tspan><tspan x="900" dy="28.5">في النهاية؟</tspan></text><rect x="440" y="190" width="280" height="180" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="690" cy="224" r="20" fill="#0F766E" stroke="none" stroke-width="2" opacity="1.0"/><text x="690" y="232" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="580" y="252" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="29" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">السياق</text><text x="580" y="302" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="580" dy="0">من أنا، ولمن النتيجة،</tspan><tspan x="580" dy="28.5">وما الخلفية؟</tspan></text><rect x="120" y="190" width="280" height="180" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="370" cy="224" r="20" fill="#14213D" stroke="none" stroke-width="2" opacity="1.0"/><text x="370" y="232" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="260" y="252" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="29" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الدور</text><text x="260" y="302" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="260" dy="0">من أي زاوية</tspan><tspan x="260" dy="28.5">تنظر؟</tspan></text><rect x="120" y="430" width="280" height="180" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="370" cy="464" r="20" fill="#0F766E" stroke="none" stroke-width="2" opacity="1.0"/><text x="370" y="472" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">4</text><text x="260" y="492" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="29" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المهمة</text><text x="260" y="542" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="260" dy="0">ما الفعل المطلوب</tspan><tspan x="260" dy="28.5">بدقة؟</tspan></text><rect x="440" y="430" width="280" height="180" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="690" cy="464" r="20" fill="#14213D" stroke="none" stroke-width="2" opacity="1.0"/><text x="690" y="472" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">5</text><text x="580" y="492" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="29" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الصيغة</text><text x="580" y="542" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="580" dy="0">بأي شكل وطول</tspan><tspan x="580" dy="28.5">ولغة؟</tspan></text><rect x="760" y="430" width="280" height="180" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="1010" cy="464" r="20" fill="#0F766E" stroke="none" stroke-width="2" opacity="1.0"/><text x="1010" y="472" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">6</text><text x="900" y="492" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="29" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المراجعة</text><text x="900" y="542" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="900" dy="0">ما الذي يحتاج</tspan><tspan x="900" dy="28.5">تحققًا أو تحسينًا؟</tspan></text><line x1="748" y1="280" x2="732" y2="280" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrow)"/><line x1="428" y1="280" x2="412" y2="280" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrow)"/><path d="M 260 378 C 260 410 260 410 260 420" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrow)"/><line x1="412" y1="520" x2="428" y2="520" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrow)"/><line x1="732" y1="520" x2="748" y2="520" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrow)"/><path d="M 1045 520 L 1085 520 Q 1105 520 1105 500 L 1105 175 Q 1105 155 1085 155 L 925 155 Q 905 155 905 175 L 905 185" fill="none" stroke="#C6A15B" stroke-width="4" opacity="1.0" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="1005" y="143" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="600" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">راجع وحدّث</text><text x="600" y="660" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الخطوات ليست خطًا مستقيمًا: يمكنك العودة إلى أي خطوة خلال الحوار.</text>
</svg>
