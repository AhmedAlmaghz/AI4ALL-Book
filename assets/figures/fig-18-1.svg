<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690"
     viewBox="0 0 1200 690" role="img" aria-labelledby="figTitle">
  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C6A15B"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14213D" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="690" fill="#FFFFFF"/>
  <title>طبقات المساعد الست</title><desc>طبقات المساعد الست — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">طبقات المساعد الست</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من الهوية إلى الذاكرة… كل طبقة تجيب سؤالًا</text><rect x="100.0" y="145" width="1000" height="66" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="145" width="8" height="66" rx="4" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="178.0" r="18" fill="#14213D" stroke="none" stroke-width="0"/><text x="142.0" y="183.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="600.0" y="175.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الهوية</text><text x="600.0" y="201.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من أنت؟ الدور، النبرة، العلاقة.</text><rect x="100.0" y="219" width="1000" height="66" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="219" width="8" height="66" rx="4" fill="#0F766E" stroke="#0F766E" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="252.0" r="18" fill="#0F766E" stroke="none" stroke-width="0"/><text x="142.0" y="257.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="600.0" y="249.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المهمة</text><text x="600.0" y="275.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ماذا تفعل؟ وما لا تفعله.</text><rect x="100.0" y="293" width="1000" height="66" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="293" width="8" height="66" rx="4" fill="#C6A15B" stroke="#C6A15B" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="326.0" r="18" fill="#C6A15B" stroke="none" stroke-width="0"/><text x="142.0" y="331.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="600.0" y="323.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#C6A15B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">السياق</text><text x="600.0" y="349.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من أنا؟ المشروع، الجمهور، القيود.</text><rect x="100.0" y="367" width="1000" height="66" rx="14" fill="#FEF2F2" stroke="#B45309" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="367" width="8" height="66" rx="4" fill="#B45309" stroke="#B45309" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="400.0" r="18" fill="#B45309" stroke="none" stroke-width="0"/><text x="142.0" y="405.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">4</text><text x="600.0" y="397.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المعرفة</text><text x="600.0" y="423.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ماذا تعرف؟ مصادر وملفات وبيانات.</text><rect x="100.0" y="441" width="1000" height="66" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="441" width="8" height="66" rx="4" fill="#15803D" stroke="#15803D" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="474.0" r="18" fill="#15803D" stroke="none" stroke-width="0"/><text x="142.0" y="479.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">5</text><text x="600.0" y="471.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#15803D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">القواعد</text><text x="600.0" y="497.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">كيف تتصرف؟ خطوط حمراء، عدم يقين، تنسيق.</text><rect x="100.0" y="515" width="1000" height="66" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="515" width="8" height="66" rx="4" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="548.0" r="18" fill="#14213D" stroke="none" stroke-width="0"/><text x="142.0" y="553.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">6</text><text x="600.0" y="545.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الذاكرة</text><text x="600.0" y="571.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ماذا تتذكر؟ قرارات وتفضيلات وتحديثات.</text><text x="600" y="648.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الطبقات ليست منفصلة؛ الهوية تحدد المهمة، والمهمة تحدد المعرفة، والقواعد تحمي الجميع.</text>
</svg>
