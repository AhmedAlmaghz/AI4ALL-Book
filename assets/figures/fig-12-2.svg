  <title>طريقة SIFT</title><desc>طريقة SIFT — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">طريقة SIFT</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أربع حركات للقراءة النقدية السريعة</text><rect x="100" y="155" width="1000" height="100" rx="14" fill="#F8FAFC" stroke="#14213D" stroke-width="2" opacity="1.0" filter="url(#softShadow)"/><circle cx="1055" cy="205" r="36" fill="#14213D" stroke="none" stroke-width="0"/><text x="1055" y="217.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">S</text><text x="990" y="189.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#14213D" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">توقف</text><text x="990" y="215.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تشارك أو تنشر قبل الفهم.</text><text x="990" y="239.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">هل أعرف ما أنظر إليه؟</text><line x1="720" y1="173" x2="720" y2="237" stroke="#E2E8F0" stroke-width="1.5" opacity="1.0"/><text x="700" y="193.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المخرج</text><text x="700" y="221.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="600" fill="#14213D" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تشارك</text><rect x="100" y="267" width="1000" height="100" rx="14" fill="#F8FAFC" stroke="#0F766E" stroke-width="2" opacity="1.0" filter="url(#softShadow)"/><circle cx="1055" cy="317" r="36" fill="#0F766E" stroke="none" stroke-width="0"/><text x="1055" y="329.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">I</text><text x="990" y="301.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#0F766E" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تحقق من المصدر</text><text x="990" y="327.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من يقف وراءه؟</text><text x="990" y="351.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من المؤلف؟ من الممول؟</text><line x1="720" y1="285" x2="720" y2="349" stroke="#E2E8F0" stroke-width="1.5" opacity="1.0"/><text x="700" y="305.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المخرج</text><text x="700" y="333.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="600" fill="#0F766E" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">اعرف المؤلف</text><rect x="100" y="379" width="1000" height="100" rx="14" fill="#F8FAFC" stroke="#C6A15B" stroke-width="2" opacity="1.0" filter="url(#softShadow)"/><circle cx="1055" cy="429" r="36" fill="#C6A15B" stroke="none" stroke-width="0"/><text x="1055" y="441.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">F</text><text x="990" y="413.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#C6A15B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ابحث عن تغطية أفضل</text><text x="990" y="439.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">هل هناك مصادر أخرى؟</text><text x="990" y="463.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">هل يغطي الموضوع مصدر أفضل؟</text><line x1="720" y1="397" x2="720" y2="461" stroke="#E2E8F0" stroke-width="1.5" opacity="1.0"/><text x="700" y="417.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المخرج</text><text x="700" y="445.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="600" fill="#C6A15B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">قارن التغطية</text><rect x="100" y="491" width="1000" height="100" rx="14" fill="#F8FAFC" stroke="#B45309" stroke-width="2" opacity="1.0" filter="url(#softShadow)"/><circle cx="1055" cy="541" r="36" fill="#B45309" stroke="none" stroke-width="0"/><text x="1055" y="553.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">T</text><text x="990" y="525.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#B45309" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تتبع الادعاء</text><text x="990" y="551.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">إلى أين يعود؟</text><text x="990" y="575.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما المصدر الأصلي؟ هل السياق محفوظ؟</text><line x1="720" y1="509" x2="720" y2="573" stroke="#E2E8F0" stroke-width="1.5" opacity="1.0"/><text x="700" y="529.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المخرج</text><text x="700" y="557.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="600" fill="#B45309" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ارجع للأصل</text><text x="600" y="618.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">SIFT إطار للقراءة النقدية السريعة، وليس بديلًا عن التحقق العميق في القرارات الحساسة.</text>
