  <title>دورة التعلم من البيانات</title><desc>دورة التعلم من البيانات — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">دورة التعلم من البيانات</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">من البيانات الخام إلى نموذج يُقيَّم… ثم يعود</text><path d="M 729.8 196.5 A 420 235 0 0 1 939.8 281.9" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><path d="M 1020.0 420.0 A 420 235 0 0 1 939.8 558.1" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><path d="M 729.8 643.5 A 420 235 0 0 1 470.2 643.5" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><path d="M 260.2 558.1 A 420 235 0 0 1 180.0 420.0" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><path d="M 260.2 281.9 A 420 235 0 0 1 470.2 196.5" fill="none" stroke="#0F766E" stroke-width="4" opacity="1.0" marker-end="url(#arrowTeal)"/><rect x="490.0" y="131.0" width="220" height="108" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="686.0" cy="155.0" r="16" fill="#14213D" stroke="none" stroke-width="0"/><text x="686.0" y="160.04" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="600.0" y="175.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">جمع البيانات</text><text x="600.0" y="205.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أمثلة كافية ومناسبة.</text><rect x="889.4437368439644" y="293.38100632188736" width="220" height="108" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="1085.4437368439644" cy="317.38100632188736" r="16" fill="#0F766E" stroke="none" stroke-width="0"/><text x="1085.4437368439644" y="322.4210063218874" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="999.4437368439644" y="337.38100632188736" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تنظيف وتجهيز</text><text x="999.4437368439644" y="367.38100632188736" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تكرار، قيم ناقصة، وحدات.</text><rect x="736.8698059628387" y="556.1189936781127" width="220" height="108" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="932.8698059628387" cy="580.1189936781127" r="16" fill="#C6A15B" stroke="none" stroke-width="0"/><text x="932.8698059628387" y="585.1589936781127" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="846.8698059628387" y="600.1189936781127" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#C6A15B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تدريب النموذج</text><text x="846.8698059628387" y="630.1189936781127" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">استخراج أنماط من الأمثلة.</text><rect x="243.13019403716135" y="556.1189936781127" width="220" height="108" rx="14" fill="#FEF2F2" stroke="#B45309" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="439.13019403716135" cy="580.1189936781127" r="16" fill="#B45309" stroke="none" stroke-width="0"/><text x="439.13019403716135" y="585.1589936781127" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">4</text><text x="353.13019403716135" y="600.1189936781127" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تقييم</text><text x="353.13019403716135" y="630.1189936781127" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">هل يعمم على بيانات جديدة؟</text><rect x="90.55626315603547" y="293.3810063218874" width="220" height="108" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="286.55626315603547" cy="317.3810063218874" r="16" fill="#15803D" stroke="none" stroke-width="0"/><text x="286.55626315603547" y="322.42100632188743" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">5</text><text x="200.55626315603547" y="337.3810063218874" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#15803D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تحسين أو نشر</text><text x="200.55626315603547" y="367.3810063218874" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">عدّل البيانات أو النموذج.</text><circle cx="600" cy="420" r="105" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.5"/><text x="600" y="412.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="23" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">دورة التعلم</text><text x="600" y="444.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">بيانات ← نموذج ← تقييم</text><text x="600" y="738.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الدورة لا تنتهي عند التنبؤ؛ التقييم يعيدك إلى البيانات أو النموذج.</text>
</svg>
