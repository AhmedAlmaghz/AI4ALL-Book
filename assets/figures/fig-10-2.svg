<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690"
     viewBox="0 0 1200 690" role="img" aria-labelledby="figTitle">
  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C6A15B"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14213D" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="690" fill="#FFFFFF"/>
  <title>إشارة المرور للمخاطر</title><desc>إشارة المرور للمخاطر — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">إشارة المرور للمخاطر</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أربعة ألوان… أربعة قرارات</text><rect x="940" y="150" width="180" height="470" rx="32" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0" filter="url(#softShadow)"/><circle cx="1030" cy="205" r="34" fill="#15803D" stroke="#FFFFFF" stroke-width="3"/><rect x="100" y="159" width="800" height="92" rx="14" fill="#F8FAFC" stroke="#15803D" stroke-width="2" opacity="1.0" filter="url(#softShadow)"/><rect x="100" y="159" width="8" height="92" rx="4" fill="#15803D" stroke="#15803D" stroke-width="2" opacity="1.0"/><text x="870" y="187.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#15803D" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أخضر</text><text x="870" y="211.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">خطر منخفض، بيانات عامة، خطأ قابل للتصحيح.</text><text x="870" y="233.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">استخدم مع تحقق عادي — تلخيص مقال منشور</text><circle cx="1030" cy="310" r="34" fill="#C6A15B" stroke="#FFFFFF" stroke-width="3"/><rect x="100" y="264" width="800" height="92" rx="14" fill="#F8FAFC" stroke="#C6A15B" stroke-width="2" opacity="1.0" filter="url(#softShadow)"/><rect x="100" y="264" width="8" height="92" rx="4" fill="#C6A15B" stroke="#C6A15B" stroke-width="2" opacity="1.0"/><text x="870" y="292.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#C6A15B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أصفر</text><text x="870" y="316.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">خطر متوسط، بيانات داخلية أو قرار محدود.</text><text x="870" y="338.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">استخدم بضوابط ومراجعة بشرية — بريد عمل، خطة درس</text><circle cx="1030" cy="415" r="34" fill="#B91C1C" stroke="#FFFFFF" stroke-width="3"/><rect x="100" y="369" width="800" height="92" rx="14" fill="#F8FAFC" stroke="#B91C1C" stroke-width="2" opacity="1.0" filter="url(#softShadow)"/><rect x="100" y="369" width="8" height="92" rx="4" fill="#B91C1C" stroke="#B91C1C" stroke-width="2" opacity="1.0"/><text x="870" y="397.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أحمر</text><text x="870" y="421.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">خطر مرتفع، بيانات حساسة أو أثر على حقوق.</text><text x="870" y="443.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">توقف، أو استخدم بيئة معتمدة — عقود، بيانات طلاب</text><circle cx="1030" cy="520" r="34" fill="#7F1D1D" stroke="#FFFFFF" stroke-width="3"/><rect x="100" y="474" width="800" height="92" rx="14" fill="#F8FAFC" stroke="#7F1D1D" stroke-width="2" opacity="1.0" filter="url(#softShadow)"/><rect x="100" y="474" width="8" height="92" rx="4" fill="#7F1D1D" stroke="#7F1D1D" stroke-width="2" opacity="1.0"/><text x="870" y="502.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#7F1D1D" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أحمر داكن</text><text x="870" y="526.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">خطر حرج، ضرر محتمل على سلامة أو حق.</text><text x="870" y="548.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تفعل، وصعّد لمختص — تشخيص طبي، قرار قانوني</text><text x="600" y="648.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">إذا لم تعرف اللون، فاعتبره أصفر على الأقل؛ وإذا كان هناك احتمال ضرر على شخص، فاعتبره أحمر.</text>
</svg>
