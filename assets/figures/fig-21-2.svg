1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أنت تنفذ</text><rect x="90" y="585" width="980" height="68" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="90" y="585" width="9" height="68" rx="4" fill="#15803D" stroke="#15803D" stroke-width="2" opacity="1.0"/><circle cx="1036" cy="619.0" r="18" fill="#15803D" stroke="none" stroke-width="0"/><text x="1036" y="624.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">0</text><text x="1004" y="613.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#15803D" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">قراءة فقط</text><text x="1004" y="637.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">يقرأ ويلخص.</text><text x="118" y="627.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="end" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مراجعة الناتج</text><text x="600" y="740.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ابدأ من 0 أو 1. لا تنتقل إلى درجة أعلى إلا بعد اختبار ناجح وسجل واضح.</text>
