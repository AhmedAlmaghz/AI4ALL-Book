  <title>سلم الصلاحيات</title><desc>سلم الصلاحيات — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">سلم الصلاحيات</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ست درجات… ابدأ من الأسفل ولا تصعد بلا دليل</text><path d="M 1128 640 L 1128 150" fill="none" stroke="#64748B" stroke-width="2" opacity="1.0" stroke-dasharray="6 6" marker-end="url(#arrowMuted)"/><text x="1128" y="132.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">صلاحية وخطر أعلى</text><text x="1128" y="668.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">صلاحية أقل</text><rect x="90" y="155" width="980" height="68" rx="14" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="90" y="155" width="9" height="68" rx="4" fill="#B91C1C" stroke="#B91C1C" stroke-width="2" opacity="1.0"/><circle cx="1036" cy="189.0" r="18" fill="#B91C1C" stroke="none" stroke-width="0"/><text x="1036" y="194.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">5</text><text x="1004" y="183.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="start" opacity="1.0" direction="rtl" style