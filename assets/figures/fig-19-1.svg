<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"
     viewBox="0 0 1200 720" role="img" aria-labelledby="figTitle">
  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C6A15B"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14213D" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <title>خزانة المعرفة الخمس</title><desc>خزانة المعرفة الخمس — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">خزانة المعرفة الخمس</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">خمس طبقات… ابدأ بالوارد والمشاريع فقط</text><rect x="100.0" y="160" width="1000" height="82" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="160" width="8" height="82" rx="4" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="201.0" r="18" fill="#14213D" stroke="none" stroke-width="0"/><text x="142.0" y="206.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="600.0" y="190.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الوارد</text><text x="600.0" y="216.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">كل ما يصل ولم يُعالج: لقطة، رابط، ملاحظة. يُفرّغ أسبوعيًا.</text><rect x="100.0" y="252" width="1000" height="82" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="252" width="8" height="82" rx="4" fill="#0F766E" stroke="#0F766E" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="293.0" r="18" fill="#0F766E" stroke="none" stroke-width="0"/><text x="142.0" y="298.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="600.0" y="282.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المشاريع</text><text x="600.0" y="308.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">عمل له هدف وموعد. بطاقة لكل مشروع، ومخرج واضح.</text><rect x="100.0" y="344" width="1000" height="82" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="344" width="8" height="82" rx="4" fill="#C6A15B" stroke="#C6A15B" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="385.0" r="18" fill="#C6A15B" stroke="none" stroke-width="0"/><text x="142.0" y="390.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="600.0" y="374.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#C6A15B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المجالات</text><text x="600.0" y="400.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مسؤوليات مستمرة: العمل، الدراسة، الصحة. لها معيار لا موعد.</text><rect x="100.0" y="436" width="1000" height="82" rx="14" fill="#FEF2F2" stroke="#B45309" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="436" width="8" height="82" rx="4" fill="#B45309" stroke="#B45309" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="477.0" r="18" fill="#B45309" stroke="none" stroke-width="0"/><text x="142.0" y="482.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">4</text><text x="600.0" y="466.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الموارد</text><text x="600.0" y="492.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مراجع وقوالب وأدلة تُستخدم لاحقًا، مرتبطة بمشروع أو مجال.</text><rect x="100.0" y="528" width="1000" height="82" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="528" width="8" height="82" rx="4" fill="#15803D" stroke="#15803D" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="569.0" r="18" fill="#15803D" stroke="none" stroke-width="0"/><text x="142.0" y="574.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">5</text><text x="600.0" y="558.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#15803D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الأرشيف</text><text x="600.0" y="584.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ما انتهى أو توقف. خارج الطريق، لكنه لا يُحذف.</text><text x="600" y="678.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الفوضى ليست كثرة الملفات؛ هي غياب قرار واضح: أين يعيش هذا الملف؟</text>
</svg>
