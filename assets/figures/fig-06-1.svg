  <rect width="1200" height="720" fill="#FFFFFF"/>
  <title>تشريح الطلب</title><desc>تشريح الطلب — رسم تعليمي من كتاب «من الصفر إلى الاحتراف».</desc>
  <text x="600" y="62.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">تشريح الطلب</text><text x="600" y="102.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">سبعة مكونات… بقدر ما تستحقه المهمة</text><rect x="100.0" y="145" width="1000" height="62" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="145" width="8" height="62" rx="4" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="176.0" r="18" fill="#14213D" stroke="none" stroke-width="0"/><text x="142.0" y="181.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="600.0" y="175.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الدور</text><text x="600.0" y="201.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">انظر كمراجع نقدي، لا ككاتب ترويجي.</text><rect x="100.0" y="215" width="1000" height="62" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="215" width="8" height="62" rx="4" fill="#0F766E" stroke="#0F766E" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="246.0" r="18" fill="#0F766E" stroke="none" stroke-width="0"/><text x="142.0" y="251.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="600.0" y="245.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الهدف</text><text x="600.0" y="271.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لاتخاذ قرار بشأن حملة الشهر القادم.</text><rect x="100.0" y="285" width="1000" height="62" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="285" width="8" height="62" rx="4" fill="#C6A15B" stroke="#C6A15B" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="316.0" r="18" fill="#C6A15B" stroke="none" stroke-width="0"/><text x="142.0" y="321.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="600.0" y="315.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#C6A15B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">السياق</text><text x="600.0" y="341.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مدير تسويق، الجمهور: إدارة عليا.</text><rect x="100.0" y="355" width="1000" height="62" rx="14" fill="#FEF2F2" stroke="#B45309" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="355" width="8" height="62" rx="4" fill="#B45309" stroke="#B45309" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="386.0" r="18" fill="#B45309" stroke="none" stroke-width="0"/><text x="142.0" y="391.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">4</text><text x="600.0" y="385.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المهمة</text><text x="600.0" y="411.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">استخرج أكبر ثلاث فئات للشكاوى.</text><rect x="100.0" y="425" width="1000" height="62" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="425" width="8" height="62" rx="4" fill="#15803D" stroke="#15803D" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="456.0" r="18" fill="#15803D" stroke="none" stroke-width="0"/><text x="142.0" y="461.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">5</text><text x="600.0" y="455.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#15803D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">المدخلات</text><text x="600.0" y="481.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ملف الشكاوى المرفق (120 شكوى).</text><rect x="100.0" y="495" width="1000" height="62" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="495" width="8" height="62" rx="4" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="526.0" r="18" fill="#14213D" stroke="none" stroke-width="0"/><text x="142.0" y="531.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">6</text><text x="600.0" y="525.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الصيغة</text><text x="600.0" y="551.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">جدول من 4 أعمدة، 300 كلمة، عربية مبسطة.</text><rect x="100.0" y="565" width="1000" height="62" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.2" opacity="1.0" filter="url(#softShadow)"/><rect x="100.0" y="565" width="8" height="62" rx="4" fill="#0F766E" stroke="#0F766E" stroke-width="2" opacity="1.0"/><circle cx="142.0" cy="596.0" r="18" fill="#0F766E" stroke="none" stroke-width="0"/><text x="142.0" y="601.76" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">7</text><text x="600.0" y="595.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">القيود والمعيار</text><text x="600.0" y="621.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">لا تخترع أرقامًا، واذكر عدد الشكاوى.</text><text x="600" y="678.0" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ليس كل طلب يحتاج المكونات السبعة؛ المهمة الأهم تستحق تفصيلًا أكثر.</text>
</svg>
