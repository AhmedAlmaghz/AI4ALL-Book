  <title>هرم المصادر</title>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="600" y="62" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">هرم المصادر</text><text x="600" y="102" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ترتيب أولي للثقة… لا حكم نهائي</text><polygon points="440.0,170 760.0,170 820.0,265 380.0,265" fill="#14213D" stroke="#14213D" stroke-width="2.5"/><text x="600" y="210" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1 · دراسة محكمة</text><text x="600" y="238" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أو بيانات رسمية أولية</text><polygon points="380.0,265 820.0,265 880.0,360 320.0,360" fill="#0F766E" stroke="#0F766E" stroke-width="2.5"/><text x="600" y="305" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2 · تقرير مؤسسة معروفة</text><text x="600" y="333" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">أو جهة رسمية</text><polygon points="320.0,360 880.0,360 940.0,455 260.0,455" fill="#C6A15B" stroke="#C6A15B" stroke-width="2.5"/><text x="600" y="416" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3 · كتاب أو مقالة تخصصية</text><polygon points="260.0,455 940.0,455 1000.0,550 200.0,550" fill="#B45309" stroke="#B45309" stroke-width="2.5"/><text x="600" y="511" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">4 · صحافة مهنية</text><polygon points="200.0,550 1000.0,550 1060.0,645 140.0,645" fill="#64748B" stroke="#64748B" stroke-width="2.5"/><text x="600" y="590" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">5 · مدونات ومنتديات</text><text x="600" y="618" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">وشبكات اجتماعية</text><path d="M 85 625 L 85 180" fill="none" stroke="#64748B" stroke-width="3" opacity="1.0" marker-end="url(#arrow)"/><text x="85" y="160" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="600" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ثقة أعلى</text><text x="85" y="660" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="16" font-weight="600" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">ثقة أقل</text><text x="600" y="720" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الهرم ترتيب أولي، لا حكم نهائي: دراسة قد تكون ضعيفة المنهج، ومصدر رسمي قد يكون متحيزًا.</text>
</svg>
