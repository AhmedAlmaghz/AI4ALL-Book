  <title>مسار المخاطرة الخمس</title>
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="600" y="62" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">مسار المخاطرة الخمس</text><text x="600" y="102" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">سمِّ… قيّم… اضبط… عيّن مالكًا… سجّل وراجع</text><rect x="950" y="170" width="200" height="300" rx="14" fill="#EEF2FF" stroke="#14213D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="1050" cy="210" r="24" fill="#14213D" stroke="none" stroke-width="2" opacity="1.0"/><text x="1050" y="218" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">1</text><text x="1050" y="262" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="23" font-weight="700" fill="#14213D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">سمِّ</text><rect x="984" y="284" width="132" height="2" rx="0" fill="#14213D" stroke="#14213D" stroke-width="2" opacity="1.0"/><text x="1050" y="320" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="1050" dy="0">بسبب [سبب]،</tspan><tspan x="1050" dy="24.65">قد يحدث [حدث]،</tspan><tspan x="1050" dy="24.65">فيؤدي إلى [أثر].</tspan></text><rect x="725" y="170" width="200" height="300" rx="14" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="825" cy="210" r="24" fill="#0F766E" stroke="none" stroke-width="2" opacity="1.0"/><text x="825" y="218" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">2</text><text x="825" y="262" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F766E" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">قيّم</text><rect x="759" y="284" width="132" height="2" rx="0" fill="#0F766E" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="825" y="320" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="825" dy="0">احتمال × أثر</tspan><tspan x="825" dy="24.65">يحددان مستوى المخاطرة.</tspan></text><rect x="500" y="170" width="200" height="300" rx="14" fill="#FFFBEB" stroke="#C6A15B" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="600" cy="210" r="24" fill="#C6A15B" stroke="none" stroke-width="2" opacity="1.0"/><text x="600" y="218" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">3</text><text x="600" y="262" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="23" font-weight="700" fill="#C6A15B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">اضبط</text><rect x="534" y="284" width="132" height="2" rx="0" fill="#C6A15B" stroke="#C6A15B" stroke-width="2" opacity="1.0"/><text x="600" y="320" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="600" dy="0">منع، تقليل،</tspan><tspan x="600" dy="24.65">نقل، أو قبول.</tspan></text><rect x="275" y="170" width="200" height="300" rx="14" fill="#FEF2F2" stroke="#B45309" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="375" cy="210" r="24" fill="#B45309" stroke="none" stroke-width="2" opacity="1.0"/><text x="375" y="218" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">4</text><text x="375" y="262" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="23" font-weight="700" fill="#B45309" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">عيّن مالكًا</text><rect x="309" y="284" width="132" height="2" rx="0" fill="#B45309" stroke="#B45309" stroke-width="2" opacity="1.0"/><text x="375" y="320" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="375" dy="0">شخص واحد مسؤول،</tspan><tspan x="375" dy="24.65">لا لجنة غامضة.</tspan></text><rect x="50" y="170" width="200" height="300" rx="14" fill="#F0FDF4" stroke="#15803D" stroke-width="2.5" opacity="1.0" filter="url(#softShadow)"/><circle cx="150" cy="210" r="24" fill="#15803D" stroke="none" stroke-width="2" opacity="1.0"/><text x="150" y="218" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">5</text><text x="150" y="262" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="23" font-weight="700" fill="#15803D" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">سجّل وراجع</text><rect x="84" y="284" width="132" height="2" rx="0" fill="#15803D" stroke="#15803D" stroke-width="2" opacity="1.0"/><text x="150" y="320" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate"><tspan x="150" dy="0">سجل المخاطر،</tspan><tspan x="150" dy="24.65">ومراجعة دورية.</tspan></text><path d="M 935 310 L 925 320 L 935 330" fill="none" stroke="#0F766E" stroke-width="3" opacity="1.0"/><path d="M 710 310 L 700 320 L 710 330" fill="none" stroke="#0F766E" stroke-width="3" opacity="1.0"/><path d="M 485 310 L 475 320 L 485 330" fill="none" stroke="#0F766E" stroke-width="3" opacity="1.0"/><path d="M 260 310 L 250 320 L 260 330" fill="none" stroke="#0F766E" stroke-width="3" opacity="1.0"/><text x="600" y="540" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0" direction="rtl" style="direction:rtl;unicode-bidi:isolate">الأداة قد تكون السبب المباشر، لكن المسؤولية تبقى لمن اختارها وحدد صلاحياتها.</text>
</svg>
